name: Publish GitHub Pages

'on':
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact 40-character commit SHA approved for public release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release approval
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::approved_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/main" ]]; then
            echo "::error::release dispatch must target refs/heads/main"
            exit 1
          fi
          if [[ "$APPROVED_SHA" != "$CURRENT_SHA" ]]; then
            echo "::error::approved_sha must equal the dispatched commit SHA"
            exit 1
          fi

      - name: Check out approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Test commercial site
        run: npm test

      - name: Test SEO contracts
        run: npm run test:seo

      - name: Test static release boundary
        run: npm run test:static

      - name: Build allowlisted artifact
        env:
          OUTPUT_DIR: ${{ runner.temp }}/autodev-public
        run: npm run build:static -- --output "$OUTPUT_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/autodev-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
